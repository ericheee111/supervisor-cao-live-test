[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "scao-live-test"
version = "0.1.0"
requires-python = ">=3.10"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
